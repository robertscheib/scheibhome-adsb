######################################################################################################################################
# ADS-B Stack — docker-compose.yml
# Managed from /opt/adsb on DietPi VM (10.10.1.71)
# Guide: https://sdr-enthusiasts.gitbook.io/ads-b
######################################################################################################################################

services:

######################################################################################################################################
# DECODER

  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    container_name: ultrafeeder
    hostname: ultrafeeder
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
    ports:
      - 8080:80
      - 9273-9274:9273-9274   # Prometheus metrics
    environment:
      - LOGLEVEL=error
      - TZ=${FEEDER_TZ}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=${ADSB_SDR_SERIAL}
      - READSB_RTLSDR_PPM=${ADSB_SDR_PPM}
      - READSB_LAT=${FEEDER_LAT}
      - READSB_LON=${FEEDER_LONG}
      - READSB_ALT=${FEEDER_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - ULTRAFEEDER_CONFIG=
          adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
          adsb,in.adsb.lol,30004,beast_reduce_plus_out;
          adsb,feed.airplanes.live,30004,beast_reduce_plus_out;
          adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
          adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;
          adsb,data.avdelphi.com,24999,beast_reduce_plus_out;
          adsb,skyfeed.hpradar.com,30004,beast_reduce_plus_out;
          adsb,feed.radarplane.com,30001,beast_reduce_plus_out;
          adsb,dati.flyitalyadsb.com,4905,beast_reduce_plus_out;
          adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;
          mlat,feed.adsb.fi,31090,--privacy;
          mlat,in.adsb.lol,31090,--privacy;
          mlat,feed.airplanes.live,31090,--privacy;
          mlat,mlat.planespotters.net,31090,--privacy;
          mlat,feed.theairtraffic.com,31090,--privacy;
          mlat,skyfeed.hpradar.com,31090,--privacy;
          mlat,feed.radarplane.com,31090,--privacy;
          mlat,dati.flyitalyadsb.com,30100,--privacy;
          mlat,feed.adsbexchange.com,31090,--privacy;
          mlathub,piaware,30105,beast_in;
          mlathub,planewatch,30105,beast_in;
      - UUID=${ULTRAFEEDER_UUID}
      - MLAT_USER=${FEEDER_NAME}
      - UPDATE_TAR1090=true
      - TAR1090_DEFAULTCENTERLAT=${FEEDER_LAT}
      - TAR1090_DEFAULTCENTERLON=${FEEDER_LONG}
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PAGETITLE=${FEEDER_NAME}
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_ENABLE_AC_DB=true
      - TAR1090_FLIGHTAWARELINKS=true
      - HEYWHATSTHAT_PANORAMA_ID=${FEEDER_HEYWHATSTHAT_ID}
      - HEYWHATSTHAT_ALTS=${FEEDER_HEYWHATSTHAT_ALTS}
      - TAR1090_SITESHOW=true
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_RANGE_OUTLINE_WIDTH=2.0
      - TAR1090_RANGERINGSDISTANCES=50,100,150,200
      - TAR1090_RANGERINGSCOLORS='#1A237E','#0D47A1','#42A5F5','#64B5F6'
      - TAR1090_USEROUTEAPI=true
      - GRAPHS1090_DARKMODE=true
      - ENABLE_TIMELAPSE1090=true
      - PROMETHEUS_ENABLE=true
      # Uncomment if dump978 is ever enabled:
      # - ENABLE_978=yes
      # - URL_978=http://dump978/skyaware978
      # Uncomment to push metrics to InfluxDB (also change image tag to :telegraf):
      # - INFLUXDBV2_URL=${INFLUX_URL}
      # - INFLUXDBV2_TOKEN=${INFLUX_TOKEN}
      # - INFLUXDBV2_BUCKET=${INFLUX_BUCKET}
    volumes:
      - /opt/adsb/ultrafeeder/globe_history:/var/globe_history
      - /opt/adsb/ultrafeeder/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M

  dump978:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-dump978
    container_name: dump978
    hostname: dump978
    restart: unless-stopped
    labels:
      - "autoheal=true"
    device_cgroup_rules:
      - 'c 189:* rwm'
    environment:
      - TZ=${FEEDER_TZ}
      - DUMP978_RTLSDR_DEVICE=${UAT_SDR_SERIAL}
      - DUMP978_SDR_GAIN=${UAT_SDR_GAIN}
      - DUMP978_SDR_PPM=${UAT_SDR_PPM}
      - LAT=${FEEDER_LAT}
      - LON=${FEEDER_LONG}
      - ENABLE_PROMETHEUS=true
    ports:
      - 30979:30979
      - 30978:30978
      - 30980:80
      - 9275:9273
    volumes:
      - /opt/adsb/dump978/autogain:/run/autogain
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run/readsb

######################################################################################################################################
# FEEDERS

  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware
    container_name: piaware
    hostname: piaware
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - 8081:8080
      - 8088:80
    environment:
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTPORT=31004
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - TZ=${FEEDER_TZ}
      - FEEDER_ID=${PIAWARE_FEEDER_ID}
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24
    container_name: fr24
    hostname: fr24
    restart: unless-stopped
    labels:
      - "autoheal=true"
    ports:
      - 8754:8754
    environment:
      - BEASTHOST=ultrafeeder
      - TZ=${FEEDER_TZ}
      - FR24KEY=${FR24_SHARING_KEY}
    tmpfs:
      - /var/log

  pfclient:
    image: ghcr.io/sdr-enthusiasts/docker-planefinder:latest
    container_name: pfclient
    restart: unless-stopped
    ports:
      - 8084:30053
    environment:
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - TZ=${FEEDER_TZ}
      - SHARECODE=${PLANEFINDER_SHARECODE}
    tmpfs:
      - /run:exec,size=64M
      - /var/log/pfclient

  airnavradar:
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar
    container_name: airnavradar
    hostname: airnavradar
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTPORT=31004
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - TZ=${FEEDER_TZ}
      - SHARING_KEY=${AIRNAVRADAR_SHARING_KEY}
    volumes:
      - /opt/adsb/rb/:/sys/class/thermal:ro
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  radarvirtuel:
    image: ghcr.io/sdr-enthusiasts/docker-radarvirtuel
    container_name: radarvirtuel
    hostname: radarvirtuel
    restart: unless-stopped
    environment:
      - FEEDER_KEY=${RV_FEEDER_KEY}
      - SOURCE_HOST=ultrafeeder:30002
      - RV_SERVER=mg22.adsbnetwork.com:50050
      - LAT=${FEEDER_LAT}
      - LON=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - MLAT_SERVER=mlat.adsbnetwork.com:50000
      - MLAT_HOST=ultrafeeder:30005
      - MLAT_RESULTS=beast,connect,ultrafeeder:31004
      - VERBOSE=OFF
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

  planewatch:
    image: ghcr.io/plane-watch/docker-plane-watch
    container_name: planewatch
    hostname: planewatch
    restart: unless-stopped
    environment:
      - BEASTHOST=ultrafeeder
      - TZ=${FEEDER_TZ}
      - API_KEY=${PLANEWATCH_KEY}
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}m
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  adsbhub:
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub
    container_name: adsbhub
    restart: unless-stopped
    environment:
      - TZ=${FEEDER_TZ}
      - SBSHOST=ultrafeeder
      - CLIENTKEY=${ADSBHUB_STATION_KEY}

  opensky:
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest
    container_name: opensky
    hostname: opensky
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME}
      - OPENSKY_SERIAL=${OPENSKY_SERIAL}
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  radar1090:
    image: ghcr.io/sdr-enthusiasts/docker-radar1090:latest
    container_name: radar1090
    hostname: radar1090
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - RADAR1090_STATION=${RADAR1090_STATION_NAME}
      - RADAR1090_KEY=${RADAR1090_KEY}
    tmpfs:
      - /run:exec,size=64M
      - /var/log

######################################################################################################################################
# VISUALIZATION

  planefence:
    image: ghcr.io/sdr-enthusiasts/docker-planefence
    container_name: planefence
    hostname: planefence
    restart: unless-stopped
    ports:
      - 8083:80
    environment:
      - TZ=${FEEDER_TZ}
    volumes:
      - /opt/adsb/planefence/config:/usr/share/planefence/persist
      - /opt/adsb/planefence/html:/usr/share/planefence/html
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=256M
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M

  screenshot:
    image: ghcr.io/sdr-enthusiasts/browser-screenshot-service:latest
    container_name: screenshot
    hostname: screenshot
    restart: unless-stopped
    shm_size: 1gb
    environment:
      - MAP_ARGS=zoom=11.5&hideSidebar&hideButtons&mapDim=0.2&monochromeMarkers=ff0000&outlineColor=505050&iconScale=1.5&enableLabels&extendedLabels=2&trackLabels
      - LOAD_SLEEP_TIME=25
      - BASE_URL=http://tar1090
      - DISABLE_SHM=true
      - MAXTIME=60

  vrs:
    image: ghcr.io/sdr-enthusiasts/vrs:latest
    container_name: vrs
    hostname: vrs
    restart: unless-stopped
    ports:
      - 8091:8080
      # - 49000-49099:49000-49099  # uncomment if ais2adsb is ever enabled
    environment:
      - VRS_ADMIN_USERNAME=${VRS_ADMIN_USERNAME}
      - VRS_ADMIN_PASSWORD=${VRS_ADMIN_PASSWORD}
      - VRS_DB_UPDATE_POLICY_FULLAUTO=yes
      - VRS_CULTURE=en-US
      - VRS_DB_UPDATE_WITH_VACUUM=yes
      - VRS_DB_UPDATE_BACKUP_UNCOMPRESSED=yes
      - VRS_ENHANCED_MARKERS=hfdl
      - VRS_ENHANCED_LAYERS_COUNTRY=USA1
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M
    volumes:
      - /opt/adsb/vrs:/root/.local/share/VirtualRadar
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

######################################################################################################################################
# DISABLED — needs second SDR

  airband:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-rtlsdrairband:latest_nohealthcheck
    container_name: airband
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
    ports:
      - 8000:8000
    environment:
      - RTLSDRAIRBAND_CUSTOMCONFIG=true
    volumes:
      - /opt/adsb/rtlsdr-airband:/run/rtlsdr-airband
      - /dev/bus/usb:/dev/bus/usb

  acarsdec:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-acarsdec:latest
    container_name: acarsdec
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
    environment:
      - TZ=${FEEDER_TZ}
      - SOAPYSDR=driver=rtlsdr,serial=${ACARS_SDR_SERIAL}
      - FREQUENCIES=${ACARS_FREQUENCIES}
      - GAIN=${ACARS_SDR_GAIN}
      - OUTPUT_SERVER=acars_router
      - OUTPUT_SERVER_PORT=5550
      - FEED_ID=${ACARS_FEEDER_ID}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  dumpvdl2:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-dumpvdl2:latest
    container_name: dumpvdl2
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
    environment:
      - TZ=${FEEDER_TZ}
      - SOAPYSDR=driver=rtlsdr,serial=${VDLM_SDR_SERIAL}
      - FREQUENCIES=${VDLM_FREQUENCIES}
      - GAIN=${VDLM_SDR_GAIN}
      - ZMQ_MODE=server
      - ZMQ_ENDPOINT=tcp://0.0.0.0:45555
      - FEED_ID=${VDLM_FEEDER_ID}
      - VDLM_FILTER_ENABLE=
      - QUIET_LOGS=FALSE
      - SERVER=
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=64M
      - /var/log

######################################################################################################################################
# DISABLED — no upstream SDR data source (enable acarsdec/dumpvdl2 first)

  acars_router:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/acars_router:latest
    container_name: acars_router
    restart: unless-stopped
    environment:
      - TZ=${FEEDER_TZ}
      - AR_SEND_UDP_ACARS=acarshub:5550;feed.acars.io:5550
      - AR_SEND_UDP_VDLM2=acarshub:5555
      - AR_SEND_TCP_VDLM2=feed.acars.io:5553
      - AR_RECV_ZMQ_VDLM2=dumpvdl2:45555
    ports:
      - 15550:15550
      - 15555:15555
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  acarshub:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-acarshub:latest
    container_name: acarshub
    hostname: acarshub
    restart: unless-stopped
    ports:
      - 8091:80
    environment:
      - TZ=${FEEDER_TZ}
      - ADSB_LAT=${FEEDER_LAT}
      - ADSB_LON=${FEEDER_LONG}
      - ENABLE_ADSB=true
      - ADSB_URL=http://tar1090/data/aircraft.json
      - ENABLE_ACARS=external
      - ENABLE_VDLM=external
    volumes:
      - /opt/adsb/acars_data:/run/acars
    tmpfs:
      - /run:exec,size=64M
      - /var/log

######################################################################################################################################
# DISABLED — NPM on 10.10.1.40 handles all reverse proxy and SSL

  webproxy:
    profiles:
      - donotstart
    image: ghcr.io/sdr-enthusiasts/docker-reversewebproxy
    container_name: webproxy
    hostname: webproxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AUTOGENERATE=ON
      - VERBOSELOG=ON
      - GEOIP_DEFAULT=ALLOW
      - GEOIP_COUNTRIES=RU,CN,BY
      - GEOIP_RESPONSECODE=418
      - REVPROXY=
            readsb|http://host.docker.internal:8080,
            graphs|http://host.docker.internal:8080/graphs1090,
            stats|http://host.docker.internal:8080/graphs1090,
            radar|http://host.docker.internal:8080,
            tar1090|http://host.docker.internal:8080,
            map|http://host.docker.internal:8080,
            ultrafeeder|http://host.docker.internal:8080,
            piaware|http://host.docker.internal:8081,
            piaware-stats|http://host.docker.internal:8088,
            planefence|http://host.docker.internal:8083,
            plane-alert|http://host.docker.internal:8083/plane-alert,
            vnstat|http://host.docker.internal:8685,
            planefinder|http://host.docker.internal:8084,ajax|http://host.docker.internal:8084/ajax,assets|http://host.docker.internal:8084/assets,
            vrs|http://host.docker.internal:8091/VirtualRadar,
            fam|http://host.docker.internal:8090,
            acarshub|http://host.docker.internal:8091
      - REDIRECT=
            /skyaware|/piaware,
            /fr24|http://$$host:8754,
            /planefinder/logs.html|http://$$host:8084/logs.html,
            /airband|http://$$host:8000
      - SSL=DISABLED
      - BLOCKBOT=
            bot,LieBaoFast,UCBrowser,MQQBrowser,Mb2345Browser,https://gdnplus.com,facebookexternalhit,http.rb,
            google,bing,yandex,msnbot,wp-login.php,zgrab,zgrab2,aws/config.php,wp-includes,Guzzle,Friendica,
            AltaVista,Googlebot,Slurp,BlackWidow,Bot,ChinaClaw,Custo,DISCo,Download,Demon,eCatch,EirGrabber,EmailSiphon,EmailWolf,SuperHTTP,Surfbot,WebWhacker,
            Express,WebPictures,ExtractorPro,EyeNetIE,FlashGet,GetRight,GetWeb!,Go!Zilla,Go-Ahead-Got-It,GrabNet,Grafula,HMView,
            rafula,HMView,HTTrack,Stripper,Sucker,Indy,InterGET,Ninja,JetCar,Spider,larbin,LeechFTP,Downloader,tool,Navroad,NearSite,NetAnts,tAkeOut,WWWOFFLE,
            GrabNet,NetSpider,Vampire,NetZIP,Octopus,Offline,PageGrabber,Foto,pavuk,pcBrowser,RealDownload,ReGet,SiteSnagger,SmartDownload,SuperBot,WebSpider,
            Teleport,VoidEYE,Collector,WebAuto,WebCopier,WebFetch,WebGo,WebLeacher,WebReaper,WebSauger,eXtractor,Quester,WebStripper,WebZIP,Widow,Zeus,
            Twengabot,htmlparser,libwww,Python,perl,urllib,scan,email,PycURL,Pyth,PyQ,WebCollector,WebCopy,webcraw,PetalBot,ubermetrics,Firefox/45,
            Vert.x-WebClient,jsonlite,rv:45.0,Nexgate Ruby Client,scoop.it,NetSystemsResearch,Barkrowler,Python-Requests,Expanse,Go-http-client,scpitspi-rs,zgrab
      - BLOCKBOT_RESPONSECODE=402
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M
    volumes:
      - /opt/adsb/webproxy:/run/nginx
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

# AIS containers (shipfeeder, vesselalert, ais-screenshot, ais2adsb) — need AIS SDR, kept commented out

######################################################################################################################################
# MAINTENANCE

  vnstat:
    image: vergoh/vnstat
    container_name: vnstat
    restart: unless-stopped
    network_mode: "host"
    ports:
      - 8685:8685
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/adsb/vnstat:/var/lib/vnstat
    environment:
      - HTTP_PORT=8685
      - HTTP_BIND=*
      - HTTP_LOG=/dev/stdout
      - LARGE_FONTS=1
      - CACHE_TIME=1
      - RATE_UNIT=0
      - PAGE_REFRESH=0
      - SERVER_NAME="ADSB Station IO Stats"

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    hostname: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped
    environment:
      - TZ=${FEEDER_TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_ROLLING_RESTART=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
